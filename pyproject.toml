[project]
name = "fenland-carbon-lab"
version = "0.1.0"
description = "Reproducible daily JULES carbon-flux emulation and reliability study"
readme = "README.md"
authors = [
    { name = "Mohammed Umar Asif Sayed" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "netcdf4>=1.7.4",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "striprtf>=0.0.33",
    "torch>=2.14.1",
]

[project.scripts]
fenland-carbon-lab = "fenland_carbon_lab.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
